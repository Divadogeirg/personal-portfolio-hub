<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ profile.name }} | CS Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="hero">
        <h1>{{ profile.name }}</h1>
        <p class="headline">{{ profile.headline }}</p>
        <p class="bio">{{ profile.bio }}</p>
        <nav class="social-links">
            <a href="{{ profile.github_url }}" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="{{ profile.linkedin_url }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="{{ profile.youtube_url }}" target="_blank" rel="noopener noreferrer">YouTube</a>
            <a href="{{ profile.twitch_url }}" target="_blank" rel="noopener noreferrer">Twitch</a>
        </nav>
    </header>

    <main class="container">
        <section>
            <h2>CS &amp; Engineering Projects</h2>
            <div class="project-grid">
                {% for project in projects %}
                <article class="card">
                    <h3>{{ project.title }}</h3>
                    <p class="stack">{{ project.stack }}</p>
                    <p>{{ project.summary }}</p>
                    <a href="{{ project.repo_url }}" target="_blank" rel="noopener noreferrer">View on GitHub</a>
                </article>
                {% endfor %}
            </div>
        </section>
    </main>
</body>
</html>
